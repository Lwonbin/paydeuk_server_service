name: MySQL Setting - called_workflow

on:
  workflow_call:
    outputs:
      db-port:
        description: "MySQL port"
        value: ${{ jobs.setup-mysql.outputs.db-port }}
      db-username:
        description: "MySQL user"
        value: ${{ jobs.setup-mysql.outputs.db-username }}
      db-password:
        description: "MySQL password"
        value: ${{ jobs.setup-mysql.outputs.db-password }}

jobs:
  setup-mysql:
    runs-on: ubuntu-latest
    outputs:
      db-port: ${{ steps.set-vars.outputs.db-port }}
      db-username: ${{ steps.set-vars.outputs.db-username }}
      db-password: ${{ steps.set-vars.outputs.db-password }}

    steps:
      - name: Start MySQL
        run: |
          docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=testdb -p 3306:3306 -d mysql:8

      - name: Wait for MySQL
        run: |
          for i in {30..0}; do
            if docker exec mysql-container mysqladmin ping -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Set output variables
        id: set-vars
        run: |
          echo "db-port=3306" >> $GITHUB_OUTPUT
          echo "db-username=root" >> $GITHUB_OUTPUT
          echo "db-password=root" >> $GITHUB_OUTPUT
